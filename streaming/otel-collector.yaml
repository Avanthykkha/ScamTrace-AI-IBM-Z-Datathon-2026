receivers:
  prometheus:
    config:
      scrape_configs:
        - job_name: redpanda
          scrape_interval: 15s
          metrics_path: /public_metrics
          static_configs:
            - targets: [redpanda:9644]
processors:
  batch:
extensions:
  health_check:
    endpoint: 0.0.0.0:13133
exporters:
  prometheus:
    endpoint: 0.0.0.0:8889
service:
  extensions: [health_check]
  pipelines:
    metrics:
      receivers: [prometheus]
      processors: [batch]
      exporters: [prometheus]
